name: CI
on:
  pull_request:
    # The repository's default branch is `master`; main/develop kept for compatibility.
    branches: [master, main, develop]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  admin:
    name: Admin lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Lockfile install with lifecycle scripts disabled.
      - run: npm ci --ignore-scripts --workspace=apps/admin --workspace=packages/types
      - run: npm run lint
      - run: npm run typecheck
      # No secrets are passed to tests. jest.env.ts replaces every DB / Redis /
      # email / Firebase setting with inert dummies and jest.network-guard.ts
      # blocks all outbound connections, so tests cannot reach real services.
      # Fetch the official MongoDB server binary (fastdl.mongodb.org) into the
      # mongodb-memory-server cache BEFORE the tests, because the test network
      # guard blocks all downloads during the run.
      - name: Prefetch MongoDB binary for isolated integration tests
        run: node -e "require('mongodb-memory-server').MongoMemoryReplSet.create({replSet:{count:1}}).then(r=>r.stop())"
      - name: Unit tests (isolated — mocked integrations, network blocked, parallel)
        run: npm run test:ci:unit
      # Each real-DB suite starts its own throw-away mongod replica set. Started
      # in parallel they compete for memory and can miss mongodb-memory-server's
      # startup timeout ("Instance failed to start within 10000ms"), so they run
      # one at a time. Nothing is skipped: RUN_DB_INTEGRATION=1 enables them all.
      - name: Real-DB integration tests (throw-away replica set, sequential)
        run: npm run test:ci:db
        env:
          RUN_DB_INTEGRATION: '1'
